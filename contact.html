    <main>
        <section class="card">
            <h1>Contact Me</h1>
            <p><strong>School Email:</strong> student.example@lspu.edu.ph</p>
            <p><strong>Social Links:</strong> <a href="https://www.canva.com" target="_blank">Canva</a> | <a href="https://discord.com" target="_blank">Discord</a></p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Enter subject">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Write your message here"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
